services:
  db:
    image: postgres:16-alpine
    container_name: protocol-writer-db
    environment:
      POSTGRES_DB: protocol
      POSTGRES_USER: protocol
      POSTGRES_PASSWORD: protocol
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protocol -d protocol"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Локальный рантайм open-source LLM для AI-функций (анализ/улучшение протоколов).
  # После первого запуска скачайте модель:
  #   docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: protocol-writer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  adminer:
    image: adminer:4
    container_name: protocol-writer-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"

volumes:
  pgdata:
  ollama:
