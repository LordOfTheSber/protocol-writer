spring:
  application:
    name: protocol-writer

  datasource:
    url: jdbc:postgresql://localhost:5432/protocol
    username: protocol
    password: protocol

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Java-фича: Virtual Threads (Java 21). Каждый HTTP-запрос обслуживается
  # виртуальным потоком — дёшево масштабируется на блокирующих вызовах (JDBC).
  threads:
    virtual:
      enabled: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: info
